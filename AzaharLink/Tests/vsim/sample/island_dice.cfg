# The dice phase of Mario Party: Island Tour hosted by a console (2026-11-14), as a load for the model: the closed-loop game of
# vsim_client.c (game=1: 180 frames a second each way, 124 to 584 bytes, the size following the delay of the confirmations) with the
# costs of the soc calls of that console in the windows of that phase (session 1, the statistics windows at 235.9 and 241.0 s:
# recv 955-964 us, send 5.8-6.3 ms with 3.7 % of them above 20 ms and none above 100; the link's round trip 8 ms; the receive ring 64 KB).
# The costs of an empty receive and of a poll are not in those windows: round figures. Synthetic: no byte of a game is in it.
# Tests/vsim/island_dice.sh runs it with and without the remedies and holds the results.
